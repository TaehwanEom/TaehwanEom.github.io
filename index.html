<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f8f8fa;
    --fg: #0a0a0b;
    --fg-soft: #6b6b76;
    --fg-mute: #a1a1ad;
    --line: #ebebef;
    --ease: cubic-bezier(.25,.1,.25,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard Variable', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  :lang(en), [lang="en"] {
    font-family: 'Inter', 'Pretendard Variable', system-ui, sans-serif;
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  .container {
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* NAV */
  .nav { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .brand-mark { width: 24px; height: 24px; background: var(--fg); border-radius: 6px; display: grid; place-items: center; }
  .brand-mark svg { width: 14px; height: 14px; stroke: var(--bg); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* HERO */
  .hero { padding: 120px 0 80px; text-align: center; }
  .wordmark { font-size: clamp(44px, 7vw, 80px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; margin: 0; }
  .hero-tag { margin-top: 20px; font-size: clamp(17px, 2vw, 20px); color: var(--fg-soft); max-width: 520px; margin-left: auto; margin-right: auto; line-height: 1.5; font-weight: 400; }

  /* APPS */
  section { padding: 80px 0; }
  .sec-title { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-mute); margin: 0 0 32px; }
  .apps { display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto; }
  .app-card { display: flex; align-items: center; gap: 16px; padding: 20px; border: 1px solid var(--line); border-radius: 16px; transition: border-color .2s var(--ease), box-shadow .2s var(--ease); }
  .app-card:hover { border-color: var(--fg); box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
  .app-icon { width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0; background: var(--fg); }
  .app-info { flex: 1; min-width: 0; }
  .app-name { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .app-desc { font-size: 14px; color: var(--fg-soft); margin-top: 2px; line-height: 1.4; }
  .app-arrow { color: var(--fg-mute); flex-shrink: 0; transition: transform .2s var(--ease); }
  .app-arrow svg { width: 16px; height: 16px; }
  .app-card:hover .app-arrow { transform: translateX(4px); color: var(--fg); }

  .coming { text-align: center; margin-top: 40px; font-size: 14px; color: var(--fg-mute); }

  /* FOOTER */
  footer { padding: 48px 0 64px; border-top: 1px solid var(--line); }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--fg-mute); }
  .foot-links { display: flex; gap: 24px; }
  .foot-links a:hover { color: var(--fg); }

  @media (max-width: 600px) {
    .hero { padding: 80px 0 48px; }
    section { padding: 48px 0; }
  }
</style>
