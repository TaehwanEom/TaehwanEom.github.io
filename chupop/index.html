<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CHEW POP — One-minute candy puzzle · AtticLab</title>
<meta name="description" content="CHEW POP is a one-minute candy match puzzle by AtticLab. Pop candies, combine special candies, hit Fever Time and climb the global ranking." />
<link rel="canonical" href="https://atticlab.app/chupop/" />
<meta name="theme-color" content="#2A1270" />
<meta property="og:type" content="website" />
<meta property="og:title" content="CHEW POP — One-minute candy puzzle" />
<meta property="og:description" content="Pop candies, combine special candies, hit Fever Time and climb the global ranking." />
<meta property="og:url" content="https://atticlab.app/chupop/" />
<meta property="og:image" content="https://atticlab.app/chupop/icon.png" />
<link rel="icon" href="icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#2A1270; --bg2:#3B1A8F; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.12);
    --ink:#FFFFFF; --ink-soft:#D9CCFF; --yellow:#FFD23F; --pink:#FF6FB5;
    --font:'Fredoka',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#5B2BB0 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
  .mark{font-weight:600;letter-spacing:.02em;text-decoration:none;opacity:.9}
  .mark b{color:var(--yellow);font-weight:700}
  .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:30px 0 60px}
  .icon{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  h1{font-size:clamp(44px,7vw,72px);line-height:1;margin:18px 0 10px;font-weight:700;letter-spacing:.01em}
  h1 span{color:var(--yellow)}
  .lead{font-size:clamp(18px,2.4vw,22px);color:var(--ink-soft);margin:0 0 26px;max-width:30ch}
  .soon{display:inline-flex;align-items:center;gap:10px;background:var(--yellow);color:#4A1E8C;font-weight:700;padding:14px 22px;border-radius:999px;box-shadow:0 6px 0 #D9A400}
  .shots{display:flex;gap:22px;justify-content:center;align-items:flex-start}
  .phone{position:relative;width:min(44%,230px);padding:9px;background:#0c0c0e;border-radius:50px;box-shadow:0 0 0 2px #9a958f,0 0 0 4px #57534f,0 22px 44px rgba(0,0,0,.45)}
  .phone::before{content:"";position:absolute;left:-7px;top:22%;width:3px;height:9%;background:#6d6964;border-radius:2px 0 0 2px;box-shadow:0 calc(100% + 14px) 0 #6d6964}
  .phone::after{content:"";position:absolute;right:-7px;top:28%;width:3px;height:14%;background:#6d6964;border-radius:0 2px 2px 0}
  .phone .island{position:absolute;top:calc(9px + 2.2%);left:50%;transform:translateX(-50%);width:27%;aspect-ratio:3.6/1;background:#000;border-radius:999px;z-index:1}
  .phone img{display:block;width:100%;height:auto;border-radius:41px}
  .shots .phone:nth-child(2){margin-top:40px}
  h2{font-size:clamp(26px,3.4vw,34px);margin:0 0 20px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:60px}
  .cardimg{width:100%;aspect-ratio:1197/1313;object-fit:contain;border-radius:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
  .card h3{margin:0 0 6px;font-size:20px;font-weight:600;color:var(--yellow)}
  .card p{margin:0;color:var(--ink-soft)}
  .contact{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:60px}
  .contact p{margin:0;color:var(--ink-soft)}
  .contact a{color:var(--yellow);font-weight:600}
  footer{border-top:1px solid var(--line);padding:24px 0 calc(24px + env(safe-area-inset-bottom));color:var(--ink-soft);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  @media (max-width:820px){
    .hero{grid-template-columns:1fr;text-align:center}
    .lead{margin-left:auto;margin-right:auto}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="mark" href="/">AtticLab · <b>CHEW POP</b></a>
  </header>

  <section class="hero">
    <div>
      <img class="icon" src="icon.png" alt="CHEW POP app icon" width="96" height="96" />
      <h1>CHEW <span>POP</span></h1>
      <p class="lead">One minute. Pop as many candies as you can and climb the global ranking.</p>
      <span class="soon">Coming soon to the App Store</span>
    </div>
    <div class="shots">
      <div class="phone"><span class="island"></span><img src="main.jpg" alt="CHEW POP main screen" loading="lazy" /></div>
      <div class="phone"><span class="island"></span><img src="game.jpg" alt="CHEW POP game board" loading="lazy" /></div>
    </div>
  </section>

  <section>
    <h2>How it plays</h2>
    <div class="grid">
      <img class="cardimg" src="cards/round.jpg" alt="One-minute rounds. Each round lasts 1 minute! Match candies to make combos and get the highest score!" loading="lazy" />
      <img class="cardimg" src="cards/special.jpg" alt="Special candies. Bigger matches and the bomb gauge give you Bombs, Ghosts and Bears. Mix them together for bigger blasts!" loading="lazy" />
      <img class="cardimg" src="cards/fever.jpg" alt="Fever Time. Every 5th combo starts Fever Time! During Fever, candies around your match pop too!" loading="lazy" />
      <img class="cardimg" src="cards/lastpang.jpg" alt="Last Pang. When time runs out, the bombs, ghosts and gummy bears left on the board pop one last time for bonus points!" loading="lazy" />
      <img class="cardimg" src="cards/ranking.jpg" alt="Global ranking. Your best score goes on the global ranking with your nickname and an optional profile photo!" loading="lazy" />
      <img class="cardimg" src="cards/free.jpg" alt="Free to play. CHEW POP is free to download and play!" loading="lazy" />
    </div>
  </section>

  <section class="contact">
    <h2>Contact</h2>
    <p>Questions or problems? Email us at <a href="mailto:support@atticlab.app">support@atticlab.app</a>.</p>
  </section>

  <footer>
    <span>© 2026 AtticLab</span>
    <span><a href="privacy/">Privacy Policy</a> · <a href="terms/">Terms of Use</a> · <a href="/">atticlab.app</a></span>
  </footer>
</div>
</body>
</html>
